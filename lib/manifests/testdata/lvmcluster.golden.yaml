apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: vsno-lvmcluster
  namespace: openshift-storage
spec:
  storage:
    deviceClasses:
    - name: vg-vsno
      default: true
      fstype: xfs
      deviceSelector:
        paths:
        - "/dev/disk/by-id/wwn-0x5000000000000002"
      nodeSelector:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: ["worker-1"]
      thinPoolConfig:
        name: thin-pool-1
        sizePercent: 90
        overprovisionRatio: 10
